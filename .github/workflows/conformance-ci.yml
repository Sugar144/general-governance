name: conformance-ci

on:
  push:
  pull_request:

jobs:
  consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install pyyaml jsonschema
      - name: Validate contract schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in sorted(Path("contracts").glob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f"PASS schema {path}")
          PY
      - name: Validate deterministic validator syntax
        run: python3 -m py_compile tools/validate_capability_stack.py tools/validate_work_packet.py
      - name: Verify prospective extraction evolution
        run: python3 tools/verify_evolution.py
      - name: Show release content digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.validate_consumer import release_content_digest
          print(f"RELEASE_CONTENT_SHA256={release_content_digest(Path('.').resolve())}")
          PY
      - name: Run consumer conformance tests
        run: python3 -m unittest -v tests/test_consumer_contract.py
      - name: Run WPDC contract regressions
        run: >-
          python3 -m unittest -v
          tests/test_work_packet_contract.py
          tests/test_work_packet_control_declarations.py
