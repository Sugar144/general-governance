name: Project State Integrity

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  project-state-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pull request inputs
        shell: bash
        env:
          PSI_PR_BODY: ${{ github.event.pull_request.body }}
          PSI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PSI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${PSI_PR_BODY:-}" > "${RUNNER_TEMP}/psi-pr-body.txt"
          PSI_MERGE_BASE="$(git merge-base "${PSI_BASE_SHA}" "${PSI_HEAD_SHA}")"
          printf '%s\n' "${PSI_MERGE_BASE}" > "${RUNNER_TEMP}/psi-merge-base.txt"
          git diff --no-renames --name-only "${PSI_MERGE_BASE}" "${PSI_HEAD_SHA}" > "${RUNNER_TEMP}/psi-changed-files.txt"

          if git cat-file -e "${PSI_MERGE_BASE}:project-state-integrity.json" 2>/dev/null; then
            git show "${PSI_MERGE_BASE}:project-state-integrity.json" > "${RUNNER_TEMP}/psi-base-config.json"
          fi

      - name: Validate project state impact against candidate contract
        run: |
          python scripts/project_state_integrity.py \
            --config project-state-integrity.json \
            --pr-body-file "${RUNNER_TEMP}/psi-pr-body.txt" \
            --changed-files-file "${RUNNER_TEMP}/psi-changed-files.txt"

      - name: Validate project state impact against accepted base contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${RUNNER_TEMP}/psi-base-config.json" ]]; then
            python scripts/project_state_integrity.py \
              --config "${RUNNER_TEMP}/psi-base-config.json" \
              --pr-body-file "${RUNNER_TEMP}/psi-pr-body.txt" \
              --changed-files-file "${RUNNER_TEMP}/psi-changed-files.txt"
          else
            echo "PROJECT_STATE_INTEGRITY: first adoption; no accepted base contract exists yet"
          fi
