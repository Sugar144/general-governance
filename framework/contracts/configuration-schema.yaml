document_id: GOV-CORE-CONFIGURATION-SCHEMA-001
version: 0.3.0
status: ACTIVE_REUSABLE_CONFIGURATION_CONTRACT
purpose: >-
  Declares the project-owned values that reusable core semantics may consume
  without embedding an adopter's paths, run identities, material-prompt namespace,
  or optional capability instance paths.
consumer_instance:
  path_source: framework-lock.json#consumer.configuration_path
  machine_schema: contracts/consumer-configuration.schema.json
  schema_version: 1.0.0
required_configuration_keys:
  - configuration.correction_example.base_run_id
  - configuration.correction_example.first_correction_id
  - configuration.paths.formal_run_prompt_snapshots
  - configuration.paths.learning_readme
  - configuration.identity_allocator.namespace
  - configuration.identity_allocator.state_path
  - configuration.identity_allocator.ledger_path
  - configuration.prompt_identity.namespace
  - configuration.prompt_identity.sequence_width
optional_capability_discovery_keys:
  - configuration.capabilities.work_packet_design.binding_path
  - configuration.capabilities.hierarchical_work_graph.bundle_path
invariants:
  - The current consumer lock names exactly one adopter-owned configuration instance.
  - Core documents may contain only declared configuration placeholders for required core values.
  - An adopter configuration owns every placeholder and optional capability discovery value.
  - Every declared core placeholder must resolve to a concrete adopter value before conformance can pass.
  - Optional capability discovery keys activate only the capability contract that owns that key.
  - Absence of an optional capability discovery key means that capability is not adopted; it is not a conformance failure.
  - Configuration values containing unresolved double-brace placeholders are invalid.
  - Material-prompt namespaces are adopter-owned and are not inferred from framework or repository history.
  - Resolving a compatibility binding must preserve the adopter's established semantics.
  - Identity namespaces and allocator state remain owned by the adopting program.
